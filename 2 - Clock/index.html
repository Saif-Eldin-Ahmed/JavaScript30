<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Elements -->
    <div class="background">
        <div class="image de"></div>
        <div class="image re"></div>
        <div class="backdrop"></div>
    </div>

    <!-- Container -->
    <div class="container">
        <div class="clock">
            <div class="hand secs"></div>
            <div class="hand mins"></div>
            <div class="hand hours"></div>
        </div>
    </div>
    <script>

        let secondsHand = document.querySelector('.secs');
        let minutesHand = document.querySelector('.mins');
        let hoursHand = document.querySelector('.hours');



        let activeDate = new Date();
        let globalSecs = activeDate.getSeconds();
        let globalMins = activeDate.getMinutes();
        let globalHours = activeDate.getHours();


        function updateClock() {
            globalSecs++
            if (globalSecs == 59) {
                globalMins++
            }

            if (globalMins == 59) {
                globalHours++
            }

            let degreeSecs = ((globalSecs / 60) * 360)
            let degreeMins = ((globalMins / 60) * 360)
            let degreeHours = ((globalHours / 12) * 360)
            secondsHand.style.transform = `rotate(${degreeSecs}deg)`;
            minutesHand.style.transform = `rotate(${degreeMins}deg)`;
            hoursHand.style.transform = `rotate(${degreeHours}deg)`;
            console.log(`${globalSecs} Seconds`)
            console.log(`${globalMins} Minutes`)
            console.log(`${globalHours} Hours`)
        }

        setInterval(updateClock, 1000)
    </script>
</body>

</html>
