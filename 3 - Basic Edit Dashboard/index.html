<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>

  <div class="controls">
    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="blur" min="0" max="25" value="10" data-sizing="px">

    <label for="base">Base Color</label>
    <input id="base" type="color" name="base" value="#ffc600">
  </div>

  <img src="https://unsplash.it/800/500?image">

  <style>
    /*
      misc styles, nothing to do with CSS variables
    */

    body {
      box-sizing: border-box;
      text-align: center;
      background: #193549;
      color: white;
      font-family: 'helvetica neue', sans-serif;
      font-weight: 100;
      font-size: 50px;
    }

    .controls {
      margin-bottom: 50px;
    }

    /* img {
      filter: blur(10px);
    } */

    input {
      width: 100px;
    }
  </style>

  <script>
    let spacingEl = document.getElementById("spacing")
    let blurEl = document.getElementById("blur")
    let baseEl = document.getElementById("base")
    let imgEl = document.querySelector('img')

    window.addEventListener('load', function () {
      imgEl.style.padding = `${spacingEl.value}px`
      imgEl.style.filter = `blur(${blurEl.value}px)`
      imgEl.style.backgroundColor = `${baseEl.value}`
    });

    spacingEl.addEventListener("input", function () {
      imgEl.style.padding = `${spacingEl.value}px`
    });

    blurEl.addEventListener("input", function () {
      imgEl.style.filter = `blur(${blurEl.value}px)`
    })

    baseEl.addEventListener("input", function () {
      imgEl.style.backgroundColor = `${baseEl.value}`
    })
  </script>

</body>

</html>
