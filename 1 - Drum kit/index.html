<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="key-box" data-key="65">
            <div class="key">A</div>
            <div class="effect-box">clap</div>
        </div>
        <div class="key-box" data-key="83">
            <div class="key">S</div>
            <div class="effect-box">hihat</div>
        </div>
        <div class="key-box" data-key="68">
            <div class="key">D</div>
            <div class="effect-box">kick</div>
        </div>
        <div class="key-box" data-key="70">
            <div class="key">F</div>
            <div class="effect-box">openhat</div>
        </div>
        <div class="key-box" data-key="71">
            <div class="key">G</div>
            <div class="effect-box">boom</div>
        </div>
        <div class="key-box" data-key="72">
            <div class="key">H</div>
            <div class="effect-box">ride</div>
        </div>
        <div class="key-box" data-key="74">
            <div class="key">J</div>
            <div class="effect-box">snare</div>
        </div>
        <div class="key-box" data-key="75">
            <div class="key">K</div>
            <div class="effect-box">tom</div>
        </div>
        <div class="key-box" data-key="76">
            <div class="key">L</div>
            <div class="effect-box">tink</div>
        </div>
    </div>

</body>

<script>

    let audios = {
        83: "hihat",
        65: "clap",
        68: "kick",
        70: "openhat",
        71: "boom",
        72: "ride",
        74: "snare",
        75: "tom",
        76: "tink",
    }
    window.addEventListener('keydown', key => {

        if (audios[key.keyCode] && !key.ctrlKey && !key.altKey && !key.shiftKey) {
            let keyBox = document.querySelector(`div[data-key='${key.keyCode}']`);
            let audio = document.createElement("audio");

            audio.setAttribute("src", `sounds/${audios[key.keyCode]}.wav`);
            document.body.appendChild(audio)
            audio.play()
            keyBox.classList.add("active")
            setTimeout(() => {
                audio.remove()
            }, 2000);
        }


    })


    window.addEventListener('keyup', key => {
        if (audios[key.keyCode]) {
            let keyBox = document.querySelector(`div[data-key='${key.keyCode}']`);
            let audio = document.querySelector(`audio[data-key='${key.keyCode}']`);
            keyBox.classList.remove("active")
        }
    })
</script>

</html>
